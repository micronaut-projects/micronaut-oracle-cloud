// The examples of the guide in Python, compiled by the Python compiler (micronaut-inject-python).
// The Python tests only run with -Ppython-ci (the "Python CI" workflow), the regular CI compiles them.
plugins {
    id 'io.micronaut.build.internal.oraclecloud-example'
    id 'io.micronaut.build.internal.python'
}

dependencies {
    // The Java test helpers of src/test/java (the mock OCI clients) are processed by javac
    testAnnotationProcessor(mn.micronaut.inject.java)

    // The Python compiler takes the (jar-resolved) compile classpath as its annotation processor path,
    // so the Micronaut processors are regular dependencies rather than annotationProcessor ones
    implementation(mnValidation.micronaut.validation.processor)
    implementation(mnSerde.micronaut.serde.processor)

    testImplementation(mn.micronaut.inject.python.test)
    testImplementation(mn.micronaut.context.python)
    testImplementation(mnTest.micronaut.test.junit5)
    testRuntimeOnly(mnTest.junit.jupiter.engine)
    testRuntimeOnly(mnTest.junit.platform.launcher)
    testRuntimeOnly(mnLogging.logback.classic)
}

// The OCI SDK modules of this build (micronaut-oraclecloud-bmc-*) publish their generated client factories and
// their dependencies (micronaut-oraclecloud-common, ...) through the metadataElements variant, which carries the
// java-runtime usage: the Python compile classpath requests the java-api usage and would resolve the stripped
// apiElements variant instead, so it requests java-runtime like a consumer of the published modules
configurations.matching { it.name.endsWith("PythonCompileClasspath") }.configureEach {
    attributes {
        attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_RUNTIME))
    }
}

// TODO(python): the examples live in src/main/python (the `source="main"` snippets of the guide) and the tests
// in src/test/python. Compiling them separately yields two GraalPy VFS roots whose generated shim modules shadow
// each other at test time, and the Python compiler resolves the imports of a source file only within its own
// source root, so both roots are merged into one directory compiled with the tests.
def mergePythonSources = tasks.register("mergePythonSources", Sync) {
    from(layout.projectDirectory.dir("src/main/python"))
    from(layout.projectDirectory.dir("src/test/python"))
    into(layout.buildDirectory.dir("merged-python-sources"))
}
tasks.named("compilePython") {
    enabled = false
}
tasks.named("compileTestPython") {
    dependsOn(mergePythonSources)
    source.setFrom(mergePythonSources.map { it.destinationDir })
    // The Python sources reference the Java mock clients of src/test/java
    dependsOn("compileTestJava")
    classpath.from(sourceSets.test.java.classesDirectory)
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    systemProperty "micronaut.python.pool.enabled", "false"
    // Gradle enables assertions in test JVMs; an internal Truffle host-interop assertion trips on varargs overloads
    enableAssertions = false
}
