plugins {
    id 'io.micronaut.build.internal.oraclecloud-python-example'
}

dependencies {
    // @SdkImport is not supported in Python: the OCI serde processor
    // (micronaut-oraclecloud-serde-processor) generates the client factory with Micronaut SourceGen, which has no
    // Python source generator, so unlike example-java and example-kotlin this project deliberately does not put
    // that processor on the compile classpath and has no example.SdkImports source.
    implementation(mn.micronaut.http.server.netty)
    implementation(mnReactor.micronaut.reactor)
    implementation(mnSerde.micronaut.serde.jackson)
    implementation(mnSerde.micronaut.serde.support)
    implementation(projects.micronautOraclecloudBmcDatabase)
    implementation(projects.micronautOraclecloudBmcObjectstorage)
    implementation(projects.micronautOraclecloudBmcVault)
    runtimeOnly(mn.snakeyaml)
    runtimeOnly(mnLogging.logback.classic)
}

// A Python Micronaut application is launched by the Python runtime, there is no Java main class to
// package a distribution for
tasks.named("startScripts") { enabled = false }
tasks.named("distZip") { enabled = false }
tasks.named("distTar") { enabled = false }
