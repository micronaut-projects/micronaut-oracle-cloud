[versions]
micronaut = "5.0.0-M13"
micronaut-platform = "4.10.8"
fn = '1.0.218'
graal-svm = "23.1.10"
javapoet = '1.13.0'
kotlin = '2.2.21'
logback-json-classic = '0.1.5'
objenesis = "3.4"
oracle-database-security = "21.20.0.0"
oci = "3.77.2"
protobuf = '0.9.5'
shadow = '8.3.9'
slf4j-jcl = '2.0.17'

managed-apache-http-core5 = "5.3.6"
micronaut-discovery-client = "5.0.0-M1"
micronaut-gradle-plugin = "4.6.2"
micronaut-groovy = "5.0.0-M1"
micronaut-kotlin = "5.0.0-M1"
micronaut-kubernetes = "8.0.0-M1"
micronaut-reactor = "4.0.0-M1"
micronaut-rxjava2 = "2.9.0"
micronaut-serde = "3.0.0-M2"
micronaut-servlet = "6.0.0-M2"
micronaut-sql = "7.0.0"
micronaut-micrometer = "6.0.1-M1"
micronaut-security = "5.0.0-M1"
micronaut-sourcegen = "2.0.0-M2"
micronaut-test = "5.0.0-M6"
micronaut-logging = "2.0.0-M2"
micronaut-validation = "5.0.0-M1"

#TODO remove these versions once dependencies do not bring vulnerable versions of these libraries
#https://ossindex.sonatype.org/vulnerability/CVE-2025-48924?component-type=maven&component-name=org.apache.commons%2Fcommons-lang3
commons-lang3 = "3.20.0"
#https://ossindex.sonatype.org/vulnerability/CVE-2025-53864?component-type=maven&component-name=com.google.code.gson%2Fgson
gson = "2.13.2"

[libraries]
# Core
micronaut-core = { module = 'io.micronaut:micronaut-core-bom', version.ref = 'micronaut' }

# micronaut boms
micronaut-discovery-client = { module = "io.micronaut.discovery:micronaut-discovery-client-bom", version.ref = "micronaut-discovery-client" }
micronaut-groovy = { module = "io.micronaut.groovy:micronaut-groovy-bom", version.ref = "micronaut-groovy" }
micronaut-kotlin = { module = "io.micronaut.kotlin:micronaut-kotlin-bom", version.ref = "micronaut-kotlin" }
micronaut-kubernetes = { module = "io.micronaut.kubernetes:micronaut-kubernetes-bom", version.ref = "micronaut-kubernetes" }
micronaut-micrometer = { module = "io.micronaut.micrometer:micronaut-micrometer-bom", version.ref = "micronaut-micrometer" }
micronaut-reactor = { module = "io.micronaut.reactor:micronaut-reactor-bom", version.ref = "micronaut-reactor" }
micronaut-rxjava2 = { module = "io.micronaut.rxjava2:micronaut-rxjava2-bom", version.ref = "micronaut-rxjava2" }
micronaut-security = { module = "io.micronaut.security:micronaut-security-bom", version.ref = "micronaut-security" }
micronaut-serde = { module = "io.micronaut.serde:micronaut-serde-bom", version.ref = "micronaut-serde" }
micronaut-servlet = { module = "io.micronaut.servlet:micronaut-servlet-bom", version.ref = "micronaut-servlet" }
micronaut-sourcegen = { module = "io.micronaut.sourcegen:micronaut-sourcegen-bom", version.ref = "micronaut-sourcegen" }
micronaut-sql = { module = "io.micronaut.sql:micronaut-sql-bom", version.ref = "micronaut-sql" }
micronaut-validation = { module = "io.micronaut.validation:micronaut-validation-bom", version.ref = "micronaut-validation" }

apache-http-core5 = { module = 'org.apache.httpcomponents.core5:httpcore5', version.ref = 'managed-apache-http-core5' }
commons-lang3 = { module = 'org.apache.commons:commons-lang3', version.ref = 'commons-lang3' }
fn-api = { module = 'com.fnproject.fn:api', version.ref = 'fn' }
fn-runtime = { module = 'com.fnproject.fn:runtime', version.ref = 'fn' }
fn-testing-junit4 = { module = 'com.fnproject.fn:testing-junit4', version.ref = 'fn' }
graal-svm = { module = "org.graalvm.nativeimage:svm", version.ref = "graal-svm"}
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
javapoet = { module = 'com.squareup:javapoet', version.ref = 'javapoet' }
kotlin-reflect = { module = 'org.jetbrains.kotlin:kotlin-reflect', version.ref = 'kotlin' }
kotlin-stdlib = { module = 'org.jetbrains.kotlin:kotlin-stdlib-jdk8', version.ref = 'kotlin' }
logback-json-classic = { module = 'ch.qos.logback.contrib:logback-json-classic', version.ref = 'logback-json-classic' }
objenesis = { module = "org.objenesis:objenesis", version.ref = "objenesis" }
oci-bom = { module = "com.oracle.oci.sdk:oci-java-sdk-bom", version.ref = "oci" }
oci-common = { module = 'com.oracle.oci.sdk:oci-java-sdk-common', version.ref = "oci" }
oci-common-httpclient = { module = 'com.oracle.oci.sdk:oci-java-sdk-common-httpclient', version.ref = "oci" }
oci-common-httpclient-jersey3 = { module = 'com.oracle.oci.sdk:oci-java-sdk-common-httpclient-jersey3', version.ref = "oci" }
oci-disasterrecovery = { module = 'com.oracle.oci.sdk:oci-java-sdk-disasterrecovery', version.ref = "oci" }
oci-encryption = { module = 'com.oracle.oci.sdk:oci-java-sdk-encryption', version.ref = "oci" }
oci-objectstorage = { module = 'com.oracle.oci.sdk:oci-java-sdk-objectstorage', version.ref = "oci" }
oci-oke-workload-identity = { module = 'com.oracle.oci.sdk:oci-java-sdk-addons-oke-workload-identity', version.ref = "oci" }
oracle-jdbc-bom = { module = "com.oracle.database.jdbc:ojdbc-bom" }
oracle-security-cert = { module = "com.oracle.database.security:osdt_cert", version.ref = "oracle-database-security" }
oracle-security-core = { module = "com.oracle.database.security:osdt_core", version.ref = "oracle-database-security" }
oracle-security-oraclepki = { module = 'com.oracle.database.security:oraclepki' }
oracle-xml-xdb = { module = 'com.oracle.database.xml:xdb' }
slf4j-jcl = { module = 'org.slf4j:jcl-over-slf4j', version.ref = 'slf4j-jcl' }

#plugins
kotlin-gradle-allopen = { module = 'org.jetbrains.kotlin:kotlin-allopen', version.ref = 'kotlin' }
kotlin-gradle-plugin = { module = 'org.jetbrains.kotlin:kotlin-gradle-plugin', version.ref = 'kotlin' }
micronaut-gradle-plugin = { module = "io.micronaut.gradle:micronaut-gradle-plugin", version.ref="micronaut-gradle-plugin" }
protobuf-gradle-plugin = { module = "com.google.protobuf:protobuf-gradle-plugin", version.ref = "protobuf" }
shadow-plugin = { module = "com.gradleup.shadow:shadow-gradle-plugin", version.ref = "shadow" }
